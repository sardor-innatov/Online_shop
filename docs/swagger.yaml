        name: card
        required: true
        schema:
          $ref: '#/definitions/dto.CardCreateDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: create
      tags:
      - card
  /card/balance/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: id
