      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: update
      tags:
      - product
  /product/stock/{id}:
    put:
      consumes:
      - application/json
      description: write possitive intagers to add items, and negative intager to
        decrease quantity of items
      parameters:
      - description: id
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: quantity
        in: query
        name: quantity
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
