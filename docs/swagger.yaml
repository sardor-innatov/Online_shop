basePath: /api/v1
definitions:
  dto.BalanceUpdateDto:
    properties:
      amaunt:
        type: number
    type: object
  dto.CardCreateDto:
    properties:
      name:
        type: string
      number:
        type: string
      paymentSystem:
        type: string
    type: object
  dto.CategoryCreateDto:
    properties:
      name:
        type: string
    type: object
  dto.LogInDto:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.OrderCreateDto:
    properties:
      cardId:
        type: integer
      items:
        items:
          $ref: '#/definitions/dto.OrderItemCreateDto'
        type: array
    type: object
  dto.OrderItemCreateDto:
    properties:
      productId:
        type: integer
      quantity:
        type: integer
    type: object
  dto.ProductCreateDto:
    properties:
      categoryId:
        format: int64
        type: integer
      description:
        type: string
      name:
        type: string
      price:
        format: float32
        type: number
      stock:
        type: integer
    type: object
  dto.RoleCreateDto:
    properties:
      permissions:
        $ref: '#/definitions/helper.JsonObject'
      roleName:
        type: string
    type: object
  dto.SignUpDto:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        type: string
    type: object
  dto.UserUpdateDto:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
    type: object
  helper.JsonObject:
    additionalProperties: {}
    type: object
host: localhost:8080
info:
  contact: {}
  title: Online-Shop API
  version: "1.0"
paths:
  /auth:
    post:
      consumes:
      - application/json
      parameters:
      - description: auth
        in: body
        name: auth
        required: true
        schema:
          $ref: '#/definitions/dto.SignUpDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: sign up
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: auth
        in: body
        name: auth
        required: true
        schema:
          $ref: '#/definitions/dto.LogInDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: login
      tags:
      - auth
  /card:
    post:
